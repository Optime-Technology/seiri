name: Seiri Windows checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build:web
      - run: npm test
      - run: npm run test:dom
      - run: python scripts/package_windows.py
        env:
          SEIRI_SIGN_PFX_BASE64: ${{ secrets.SEIRI_SIGN_PFX_BASE64 }}
          SEIRI_SIGN_PASSWORD: ${{ secrets.SEIRI_SIGN_PASSWORD }}
      - run: pwsh -NoProfile -File dist/Seiri_Windows_x64/Windows-Kontrol.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Seiri-Windows-beta
          path: |
            ../Seiri_Windows_*_x64.zip
            DOGRULAMA.json
            LEARNING_BENCHMARK.json
          if-no-files-found: error
