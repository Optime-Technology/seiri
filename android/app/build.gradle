plugins { id 'com.android.application' }
android {
    namespace 'com.zaman.ajanda'
    compileSdk 36
    defaultConfig { applicationId 'com.zaman.ajanda'; minSdk 26; targetSdk 36; versionCode 1180; versionName '1.18.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    signingConfigs { test { storeFile rootProject.file('debug-signing/zaman-debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { signingConfig signingConfigs.test }; release { minifyEnabled false } }
}
